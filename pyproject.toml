[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telematics-data-foundation"
version = "0.1.0"
description = "De-identified fleet-telematics data model: pseudonymization pipeline, DuckDB warehouse, data-quality checks and snapshot findings."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=1.0",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
